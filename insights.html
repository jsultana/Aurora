<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora Insights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Aurora Insights</h1>

        <div id="summary">
            <p>Total focus sessions: <span id="sessionCount">0</span></p>
            <p>Total focus minutes: <span id="totalMinutes">0</span></p>
            <p>Most used tag: <span id="mostUsedTag">None yet</span></p>

            <h3>Minutes per tag</h3>
            <ul id="tagMinutesList"></ul>
        </div>

        <h3>Focus Time by Tag</h3>
        <canvas id="tagChart"></canvas>

        <h3>Session History</h3>
        <ul id="sessionList"></ul>

        <br>
<a href="index.html">← Back to Timer</a>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="insights.js"></script>
</body>
</html>
