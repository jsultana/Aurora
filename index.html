<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Aurora</h1>
        <h2 id="modeLabel">Focus</h2>
        <div id="timer">25:00</div>

        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
    </div>

    <br>
    <a href="insights.html">View Insights</a>

    <div class="settings">
        <label>
            Focus (minutes):
            <input type="number" id="focusInput" min="1" max="120" value="25">
        </label>

        <label>
            Break (minutes):
            <input type="number" id="breakInput" min="1" max="60" value="5">
        </label>

        <label>
            Session tag:
            <input type="text" id="tagInput" placeholder="e.g. FYP">
        </label>

        <button id="applyBtn">Apply</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
