<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Aurora</h1>
        <h2 id="modeLabel">Focus</h2>
        <div id="timer">25:00</div>
        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <div class="settings">
    <label>
        Focus (minutes):
        <input type="number" id="focusInput" min="1" max="120" value="25">
    </label>

    <div id="summary">
    <p>Total focus sessions: <span id="sessionCount">0</span></p>
    <p>Total focus minutes: <span id="totalMinutes">0</span></p>
</div>

    <h3>Session History</h3>
<ul id="sessionList"></ul>

    <label>
        Break (minutes):
        <input type="number" id="breakInput" min="1" max="60" value="5">
    </label>

    <button id="applyBtn">Apply</button>
</div>

    <script src="script.js"></script>
</body>
</html>
